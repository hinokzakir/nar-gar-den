<!DOCTYPE html>
<html>
<head>
    <title>Bus Display Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: darkorange;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Bus Display Settings</h1>
    <form action="/update" method="post">
        <div class="form-group">
            <label for="site_id">Site ID:</label>
            <input type="text" id="site_id" name="site_id" value="{{ settings.SITE_ID }}">
        </div>
        <div class="form-group">
            <label for="departures_to_show">Number of Departures to Show:</label>
            <input type="number" id="departures_to_show" name="departures_to_show" value="{{ settings.DEPARTURES_TO_SHOW }}">
        </div>
        <button type="submit">Save Settings</button>
    </form>
</body>
</html>
