<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NärGårDen? - Bus Departures</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>NärGårDen?</h1>
        <div id="platforms"></div>
        <div class="last-updated">Last updated: <span id="timestamp"></span></div>
    </div>

    <script>
        // Function to format time difference
        function formatTimeUntil(departureTime) {
            const now = new Date();
            const [hours, minutes] = departureTime.split(':').map(Number);
            const departureDate = new Date(now);
            departureDate.setHours(hours, minutes, 0, 0);

            // If the departure time is earlier than now, assume it's for tomorrow
            if (departureDate < now) {
                departureDate.setDate(departureDate.getDate() + 1);
            }

            const diffMs = departureDate - now;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const diffSecs = Math.floor((diffMs % (1000 * 60)) / 1000);

            return `${diffMins}m${diffSecs}s`;
        }

        // Function to update the display
        function updateDisplay() {
            fetch('departure_lists/platform_departures.json')
                .then(response => response.json())
                .then(data => {
                    const platformsDiv = document.getElementById('platforms');
                    platformsDiv.innerHTML = '';

                    // Update timestamp
                    document.getElementById('timestamp').textContent = 
                        new Date(data.timestamp).toLocaleTimeString();

                    // Create platform sections
                    Object.entries(data.platforms).forEach(([platform, departures]) => {
                        const platformDiv = document.createElement('div');
                        platformDiv.className = 'platform';
                        
                        const platformTitle = document.createElement('h2');
                        platformTitle.textContent = `Platform ${platform}`;
                        platformDiv.appendChild(platformTitle);

                        const departuresList = document.createElement('div');
                        departuresList.className = 'departures';

                        departures.forEach(dep => {
                            const departureDiv = document.createElement('div');
                            departureDiv.className = 'departure';
                            
                            const routeSpan = document.createElement('span');
                            routeSpan.className = 'route';
                            routeSpan.textContent = dep.route;
                            
                            const timeSpan = document.createElement('span');
                            timeSpan.className = 'time';
                            timeSpan.textContent = formatTimeUntil(dep.time);
                            
                            departureDiv.appendChild(routeSpan);
                            departureDiv.appendChild(timeSpan);
                            departuresList.appendChild(departureDiv);
                        });

                        platformDiv.appendChild(departuresList);
                        platformsDiv.appendChild(platformDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching departures:', error);
                    document.getElementById('platforms').innerHTML = 
                        '<div class="error">Error loading departures. Please try again later.</div>';
                });
        }

        // Update immediately and then every second
        updateDisplay();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
